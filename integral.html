<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integral | BERCOUNTING</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <body>

    <main class="container">

        <div class="integral-header">

            <a href="index.html" class="back-button">
                Back
            </a>

            <h1>INTEGRAL</h1>

            <p>Numerical Integration Calculator</p>

        </div>

        <div class="calculator-box">

            <label for="function">Mathematical Function f(x)</label>
            <input type="text" id="function" placeholder="Example: x^2 + 2^x + 1">

            <div class="input-row">
                <div>
                    <label for="lower">Lower Limit (a)</label>
                    <input type="number" id="lower" placeholder="0">
                </div>

                <div>
                    <label for="upper">Upper Limit (b)</label>
                    <input type="number" id="upper" placeholder="2">
                </div>
            </div>

            <label for="method">Numerical Method</label>
            <select id="method">
                <option value="riemann">Riemann Sum</option>
                <option value="trapezoidal">Trapezoidal Rule</option>
                <option value="simpson">Simpson's Rule</option>
            </select>

            <label for="intervals">Number of Subintervals (n)</label>
            <input type="number" id="intervals" value="10" min="2">

            <button onclick="calculateIntegral()">Calculate Integral</button>

            <div id="result"></div>

        </div>


    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['\\(', '\\)']],
            displayMath: [['\\[', '\\]']]
        },
        svg: {
            fontCache: 'global'
        }
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="script.js"></script>

</body>

</html>
